#: The greys are the base16 ramp, which inverts with the mode; the hues are M3
#: roles, whose `X` / `on_X_container` pair gives two legible tones per hue in
#: either mode. base08-base0F are avoided on purpose: they do NOT invert, so in
#: a light palette they render as near-white and `ls`/`git` output disappears.
#: A matugen palette has four hues for ANSI's six, so magenta and cyan reuse
#: the blue and green tones swapped rather than inventing a colour.
#: black
color0  #141318
color8  #51324f
#: red
color1  #ffb4ab
color9  #ffdad6
#: green
color2  #cac3dc
color10 #e6dff8
#: yellow
color3  #eeb8cb
color11 #ffd9e5
#: blue
color4  #ccbeff
color12 #e7deff
#: magenta
color5  #e7deff
color13 #ccbeff
#: cyan
color6  #e6dff8
color14 #cac3dc
#: white
color7  #844e57
color15 #e6e1e9

