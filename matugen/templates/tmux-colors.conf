# matugen mode marker for tmux — written from {{image}} in {{mode}} mode.
#
# DO NOT EDIT the output (tmux/colors.conf): it is overwritten by every
# `matugen image` / `theme-mode` run. Edit this template instead.
#
# tmux takes its colours from catppuccin — latte in light mode, mocha in dark —
# not from the wallpaper. Same call as nvim, for the same reason: a matugen
# palette carries four hues, which is enough for a bar's surfaces but leaves
# catppuccin's fourteen colour names reading as the same few tones.
#
# So all this file carries is the mode matugen last ran in. .tmux.conf turns
# that into a flavour, because matugen's template engine has no conditionals:
# `{% if %}` renders verbatim, and only `{{mode}}` expands.
#
# It has to be sourced before catppuccin.tmux runs — the plugin reads
# @catppuccin_flavor at load time.

set -gq @theme_mode "{{mode}}"
