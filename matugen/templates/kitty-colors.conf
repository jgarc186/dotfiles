#: The greys are the base16 ramp, which inverts with the mode; the hues are M3
#: roles, whose `X` / `on_X_container` pair gives two legible tones per hue in
#: either mode. base08-base0F are avoided on purpose: they do NOT invert, so in
#: a light palette they render as near-white and `ls`/`git` output disappears.
#: A matugen palette has four hues for ANSI's six, so magenta and cyan reuse
#: the blue and green tones swapped rather than inventing a colour.
#: black
color0  {{ colors.surface.default.hex }}
color8  {{ base16.base03.default.hex }}
#: red
color1  {{ colors.error.default.hex }}
color9  {{ colors.on_error_container.default.hex }}
#: green
color2  {{ colors.secondary.default.hex }}
color10 {{ colors.on_secondary_container.default.hex }}
#: yellow
color3  {{ colors.tertiary.default.hex }}
color11 {{ colors.on_tertiary_container.default.hex }}
#: blue
color4  {{ colors.primary.default.hex }}
color12 {{ colors.on_primary_container.default.hex }}
#: magenta
color5  {{ colors.on_primary_container.default.hex }}
color13 {{ colors.primary.default.hex }}
#: cyan
color6  {{ colors.on_secondary_container.default.hex }}
color14 {{ colors.secondary.default.hex }}
#: white
color7  {{ base16.base05.default.hex }}
color15 {{ colors.on_surface.default.hex }}

