# matugen palette for tmux — generated from /home/jose/developer/dotfiles/wallpapers/Wallpaper Violet Evergarden White And Black.png in dark mode.
#
# DO NOT EDIT the output (tmux/colors.conf): it is overwritten by every
# `matugen image` / `theme-mode` run. Edit this template instead.
#
# These are the @thm_* variable names the catppuccin/tmux plugin reads, filled
# from matugen's Material 3 roles. Setting names the plugin
# doesn't read — @thm_primary, @thm_surface_low — is how this file spent a
# while writing colours nobody consumed, so tmux/tests/run_tests.sh checks the
# two name sets against each other.
#
# .tmux.conf sources this BEFORE running catppuccin.tmux: the plugin sets its
# palette with `set -ogq` (only if unset) and bakes some module colours at load
# with -ogqF, so whatever is already set wins and sourcing afterwards would
# leave the baked ones on catppuccin's own colours.
#
# Palette variables only — no style statements. .tmux.conf keeps the status
# line transparent so the terminal (matugen-themed too) shows through, and a
# window-active-style here would make the panes opaque.
#
# Every value is `.default`, i.e. whatever --mode the run used; a hardcoded
# `.dark` renders dark colours into a light-mode run.

# -- Structure: M3 surface roles, dimmest to brightest ----------------------
set -gq @thm_crust      "#0e0f08"
set -gq @thm_mantle     "#1c1c14"
set -gq @thm_bg         "#14140c"
set -gq @thm_surface_0  "#202018"
set -gq @thm_surface_1  "#2b2a22"
set -gq @thm_surface_2  "#35352c"
set -gq @thm_overlay_0  "#48473b"
set -gq @thm_overlay_1  "#929182"
set -gq @thm_overlay_2  "#c9c7b6"
set -gq @thm_subtext_0  "#c9c7b6"
set -gq @thm_subtext_1  "#e5e3d6"
set -gq @thm_fg         "#e5e3d6"

# -- Accents ----------------------------------------------------------------
# From the M3 roles, NOT base16: matugen's base08-base0F are identical in light
# and dark mode (only base00-base07 invert), so they read as near-white in a
# light palette and half of them collapse into each other in a dark one. Each
# role below flips with the mode — `X` and `on_X_container` are the two legible
# tones of one hue — so the bar keeps its contrast either way.
#
# A matugen palette has four hues (primary/secondary/tertiary/error) for
# catppuccin's fourteen colour names, so some names share a colour. That is the
# palette being monochromatic by design, not a mapping mistake.
set -gq @thm_red        "#ffb4ab"
set -gq @thm_maroon     "#ffdad6"
set -gq @thm_peach      "#a3d0bf"
set -gq @thm_yellow     "#bfecda"
set -gq @thm_green      "#c9c9a5"
set -gq @thm_teal       "#e5e5c0"
set -gq @thm_sky        "#c9c9a5"
set -gq @thm_sapphire   "#c8cc78"
set -gq @thm_blue       "#c8cc78"
set -gq @thm_lavender   "#e5e891"
set -gq @thm_mauve      "#a3d0bf"
set -gq @thm_pink       "#bfecda"
set -gq @thm_flamingo   "#ffdad6"
set -gq @thm_rosewater  "#e5e5c0"
